services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - core-api-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # UI de administracion (http://localhost:15672)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  core-api:
    build: ../CoreApi
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  moderation-engine:
    build: ../ModerationEngine
    ports:
      - "8000:8000"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      MODERATION_QUEUE: ${MODERATION_QUEUE}
      CENTRAL_API_BASE_URL: http://core-api:8080
    depends_on:
      rabbitmq:
        condition: service_healthy
      core-api:
        condition: service_started

  ingestor:
    build: ../Ingestor
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      MODERATION_QUEUE: ${MODERATION_QUEUE}
      # Opcionales: si quedan vacias, el Ingestor se conecta a Twitch en modo
      # anonimo (solo lectura, no puede mandar mensajes/timeouts).
      TWITCH_USERNAME: ${TWITCH_USERNAME:-}
      TWITCH_OAUTH_TOKEN: ${TWITCH_OAUTH_TOKEN:-}
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  core-api-postgres-data:
